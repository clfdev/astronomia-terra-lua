<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Visualização da Translação da Lua - Astronomia: Terra e Lua">
    <title>Visualização da Translação da Lua</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .back-button {
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: rgba(25, 25, 35, 0.9);
            color: #8be9fd;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .back-button:hover, .back-button:active {
            background-color: rgba(35, 35, 45, 0.9);
            transform: scale(1.05);
        }
        
        svg {
            width: 100%;
            height: auto;
            max-width: 800px;
            margin: 0 auto;
            display: block;
        }
        
        text {
            font-family: Arial, sans-serif;
        }
        
        .info-section {
            max-width: 800px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: clamp(0.9rem, 2vw, 1rem);
            margin: 20px;
            box-sizing: border-box;
        }
        
        @media (max-width: 600px) {
            .back-button {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            text {
                font-size: 80% !important;
            }
            
            .info-section {
                padding: 15px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="window.location.href='index.html'">←</button>
    
    <div class="info-section">
        <svg viewBox="0 0 800 1700" xmlns="http://www.w3.org/2000/svg">
            <!-- Fundo -->
            <rect width="800" height="1700" fill="#111" />
            
            <!-- Título -->
            <text x="400" y="40" fill="white" font-size="22" font-weight="bold" text-anchor="middle">
              Movimento e Fases da Lua
            </text>
            
            <!-- Espaço para a órbita da Lua ao redor da Terra -->
            <g transform="translate(400, 320)">
              <!-- Órbita da Lua (elipse) -->
              <ellipse cx="0" cy="0" rx="192" ry="191.91" 
                       fill="none" stroke="#444" stroke-width="1" stroke-dasharray="2,2" />
              
              <!-- Eixo maior -->
              <line x1="-192" y1="0" x2="192" y2="0" 
                    stroke="#444" stroke-width="1" stroke-dasharray="5,5" />
              
              <!-- Eixo menor -->
              <line x1="0" y1="-191.91" x2="0" y2="191.91" 
                    stroke="#444" stroke-width="1" stroke-dasharray="5,5" />
              
              <!-- Terra no centro -->
              <circle cx="0" cy="0" r="16" fill="#1E90FF">
                <title>Terra</title>
              </circle>
              <circle cx="0" cy="0" r="20" fill="rgba(30,144,255,0.3)" />
              
              <!-- Direção do Sol (simplificado, como se estivesse muito longe à direita) -->
              <line x1="0" y1="0" x2="400" y2="0" stroke="#FFD700" stroke-width="1" stroke-dasharray="5,5" />
              <text x="240" y="15" fill="#FFD700" font-size="12">Luz Solar</text>
              <polygon points="400,0 390,5 390,-5" fill="#FFD700" />
              
              <!-- Lua em diferentes posições e fases -->
              <!-- Posição 1: Lua Nova (0°) -->
              <g transform="translate(192, 0)">
                <circle cx="0" cy="0" r="8" fill="#888" />
                <circle cx="0" cy="0" r="8" fill="#111" clip-path="url(#newMoonClip)" />
                <text x="15" y="-15" fill="white" font-size="14">Lua Nova</text>
                <text x="15" y="5" fill="#AAA" font-size="12">363.296 km</text>
                <text x="15" y="25" fill="#AAA" font-size="12">Dia 1</text>
              </g>
              
              <!-- Posição 2: Lua Crescente (45°) -->
              <g transform="translate(135.76, -135.76)">
                <circle cx="0" cy="0" r="8" fill="#888" />
                <circle cx="0" cy="0" r="8" fill="#111" clip-path="url(#crescentMoonClip)" />
                <text x="15" y="-15" fill="white" font-size="14">Lua Crescente</text>
                <text x="15" y="5" fill="#AAA" font-size="12">~373.000 km</text>
                <text x="15" y="25" fill="#AAA" font-size="12">~Dia 7</text>
              </g>
              
              <!-- Posição 3: Quarto Crescente (90°) -->
              <g transform="translate(0, -191.91)">
                <circle cx="0" cy="0" r="8" fill="#888" />
                <circle cx="0" cy="0" r="8" fill="#111" clip-path="url(#firstQuarterClip)" />
                <text x="15" y="-15" fill="white" font-size="14">Quarto Crescente</text>
                <text x="15" y="5" fill="#AAA" font-size="12">383.241 km</text>
                <text x="15" y="25" fill="#AAA" font-size="12">Dia ~7.4</text>
              </g>
              
              <!-- Posição 4: Lua Gibosa Crescente (135°) -->
              <g transform="translate(-135.76, -135.76)">
                <circle cx="0" cy="0" r="8" fill="#888" />
                <circle cx="0" cy="0" r="8" fill="#111" clip-path="url(#gibbousMoonClip)" />
                <text x="-140" y="-15" fill="white" font-size="14">Lua Gibosa Crescente</text>
                <text x="-140" y="5" fill="#AAA" font-size="12">~395.000 km</text>
                <text x="-140" y="25" fill="#AAA" font-size="12">~Dia 11</text>
              </g>
              
              <!-- Posição 5: Lua Cheia (180°) -->
              <g transform="translate(-192, 0)">
                <circle cx="0" cy="0" r="8" fill="#DDD" />
                <text x="-100" y="-15" fill="white" font-size="14">Lua Cheia</text>
                <text x="-100" y="5" fill="#AAA" font-size="12">405.504 km</text>
                <text x="-100" y="25" fill="#AAA" font-size="12">Dia ~14.8</text>
              </g>
              
              <!-- Posição 6: Lua Gibosa Minguante (225°) -->
              <g transform="translate(-135.76, 135.76)">
                <circle cx="0" cy="0" r="8" fill="#888" />
                <circle cx="0" cy="0" r="8" fill="#111" clip-path="url(#waningGibbousClip)" />
                <text x="-140" y="25" fill="white" font-size="14">Lua Gibosa Minguante</text>
                <text x="-140" y="45" fill="#AAA" font-size="12">~395.000 km</text>
                <text x="-140" y="65" fill="#AAA" font-size="12">~Dia 18</text>
              </g>
              
              <!-- Posição 7: Quarto Minguante (270°) -->
              <g transform="translate(0, 191.91)">
                <circle cx="0" cy="0" r="8" fill="#888" />
                <circle cx="0" cy="0" r="8" fill="#111" clip-path="url(#lastQuarterClip)" />
                <text x="15" y="25" fill="white" font-size="14">Quarto Minguante</text>
                <text x="15" y="45" fill="#AAA" font-size="12">383.241 km</text>
                <text x="15" y="65" fill="#AAA" font-size="12">Dia ~22.1</text>
              </g>
              
              <!-- Posição 8: Lua Minguante (315°) -->
              <g transform="translate(135.76, 135.76)">
                <circle cx="0" cy="0" r="8" fill="#888" />
                <circle cx="0" cy="0" r="8" fill="#111" clip-path="url(#waningCrescentClip)" />
                <text x="15" y="25" fill="white" font-size="14">Lua Minguante</text>
                <text x="15" y="45" fill="#AAA" font-size="12">~373.000 km</text>
                <text x="15" y="65" fill="#AAA" font-size="12">~Dia 26</text>
              </g>
              
              <!-- Legenda -->
              <text x="-350" y="-270" fill="white" font-size="14" font-weight="bold">Órbita da Lua</text>
              <text x="-350" y="-245" fill="#AAA" font-size="12">* Distância média Terra-Lua: 384.400 km</text>
              <text x="-350" y="-225" fill="#AAA" font-size="12">* Perigeu (ponto mais próximo): 363.296 km</text>
              <text x="-350" y="-205" fill="#AAA" font-size="12">* Apogeu (ponto mais distante): 405.504 km</text>
              <text x="-350" y="-185" fill="#AAA" font-size="12">* Período orbital sideral: 27,32 dias</text>
              <text x="-350" y="-165" fill="#AAA" font-size="12">* Período sinódico (ciclo de fases): 29,53 dias</text>
              <text x="-350" y="-145" fill="#AAA" font-size="12">* Excentricidade da órbita: 0,0549</text>
            </g>
            
            <!-- Definições das clips para as fases da lua -->
            <defs>
              <clipPath id="newMoonClip">
                <rect x="-8" y="-8" width="16" height="16" />
              </clipPath>
              <clipPath id="crescentMoonClip">
                <rect x="-8" y="-8" width="12" height="16" />
              </clipPath>
              <clipPath id="firstQuarterClip">
                <rect x="-8" y="-8" width="8" height="16" />
              </clipPath>
              <clipPath id="gibbousMoonClip">
                <rect x="-8" y="-8" width="4" height="16" />
              </clipPath>
              <clipPath id="waningGibbousClip">
                <rect x="4" y="-8" width="4" height="16" />
              </clipPath>
              <clipPath id="lastQuarterClip">
                <rect x="0" y="-8" width="8" height="16" />
              </clipPath>
              <clipPath id="waningCrescentClip">
                <rect x="4" y="-8" width="4" height="16" />
              </clipPath>
            </defs>
            
            <!-- Representação detalhada das fases -->
            <g transform="translate(400, 650)">
              <text x="0" y="-90" fill="white" font-size="18" font-weight="bold" text-anchor="middle">Fases da Lua</text>
              
              <!-- Lua Nova -->
              <g transform="translate(-300, 0)">
                <circle cx="0" cy="0" r="30" fill="#888" />
                <circle cx="0" cy="0" r="30" fill="#111" />
                <text x="0" y="50" fill="white" font-size="14" text-anchor="middle">Lua Nova</text>
                <text x="0" y="70" fill="#AAA" font-size="12" text-anchor="middle">Dia 1</text>
              </g>
              
              <!-- Lua Crescente -->
              <g transform="translate(-200, 0)">
                <circle cx="0" cy="0" r="30" fill="#888" />
                <!-- Parte escura -->
                <path d="M 0,-30 A 30,30 0 0 1 0,30 A 20,30 0 0 0 0,-30" fill="#111" />
                <text x="0" y="50" fill="white" font-size="14" text-anchor="middle">Crescente</text>
                <text x="0" y="70" fill="#AAA" font-size="12" text-anchor="middle">Dia ~7</text>
              </g>
              
              <!-- Quarto Crescente -->
              <g transform="translate(-100, 0)">
                <circle cx="0" cy="0" r="30" fill="#888" />
                <!-- Parte escura -->
                <path d="M 0,-30 A 30,30 0 0 1 0,30 L 0,-30" fill="#111" />
                <text x="0" y="50" fill="white" font-size="14" text-anchor="middle">Quarto Crescente</text>
                <text x="0" y="70" fill="#AAA" font-size="12" text-anchor="middle">Dia ~7.4</text>
              </g>
              
              <!-- Lua Gibosa Crescente -->
              <g transform="translate(0, 0)">
                <circle cx="0" cy="0" r="30" fill="#888" />
                <!-- Parte escura -->
                <path d="M 0,-30 A 30,30 0 0 1 0,30 A 60,30 0 0 1 0,-30" fill="#111" />
                <text x="0" y="50" fill="white" font-size="14" text-anchor="middle">Gibosa Crescente</text>
                <text x="0" y="70" fill="#AAA" font-size="12" text-anchor="middle">Dia ~11</text>
              </g>
              
              <!-- Lua Cheia -->
              <g transform="translate(100, 0)">
                <circle cx="0" cy="0" r="30" fill="#DDD" />
                <text x="0" y="50" fill="white" font-size="14" text-anchor="middle">Lua Cheia</text>
                <text x="0" y="70" fill="#AAA" font-size="12" text-anchor="middle">Dia ~14.8</text>
              </g>
              
              <!-- Lua Gibosa Minguante -->
              <g transform="translate(200, 0)">
                <circle cx="0" cy="0" r="30" fill="#888" />
                <!-- Parte escura -->
                <path d="M 0,-30 A 30,30 0 0 0 0,30 A 60,30 0 0 0 0,-30" fill="#111" />
                <text x="0" y="50" fill="white" font-size="14" text-anchor="middle">Gibosa Minguante</text>
                <text x="0" y="70" fill="#AAA" font-size="12" text-anchor="middle">Dia ~18</text>
              </g>
              
              <!-- Quarto Minguante -->
              <g transform="translate(300, 0)">
                <circle cx="0" cy="0" r="30" fill="#888" />
                <!-- Parte escura -->
                <path d="M 0,-30 A 30,30 0 0 0 0,30 L 0,-30" fill="#111" />
                <text x="0" y="50" fill="white" font-size="14" text-anchor="middle">Quarto Minguante</text>
                <text x="0" y="70" fill="#AAA" font-size="12" text-anchor="middle">Dia ~22.1</text>
              </g>
              
              <!-- Lua Minguante -->
              <g transform="translate(0, 130)">
                <circle cx="0" cy="0" r="30" fill="#888" />
                <!-- Parte escura -->
                <path d="M 0,-30 A 30,30 0 0 0 0,30 A 20,30 0 0 1 0,-30" fill="#111" />
                <text x="0" y="50" fill="white" font-size="14" text-anchor="middle">Minguante</text>
                <text x="0" y="70" fill="#AAA" font-size="12" text-anchor="middle">Dia ~26</text>
              </g>
            </g>
            
            <!-- Informações adicionais -->
            <g transform="translate(50, 850)">
              <text x="0" y="0" fill="white" font-size="18" font-weight="bold">Informações sobre o Movimento Lunar</text>
              
              <text x="0" y="40" fill="white" font-size="16">
                A Lua realiza um movimento elíptico ao redor da Terra, com uma excentricidade de 0,0549,
              </text>
              <text x="0" y="65" fill="white" font-size="16">
                significativamente maior que a excentricidade da órbita da Terra ao redor do Sol (0,0167).
              </text>
              
              <text x="0" y="105" fill="white" font-size="16" font-weight="bold">A equação do deslocamento lunar:</text>
              <text x="0" y="145" fill="#8CF" font-size="20" font-weight="bold">r = a(1-e²)/(1+e·cos(θ))</text>
              
              <text x="0" y="185" fill="white" font-size="16">Onde:</text>
              <text x="20" y="215" fill="white" font-size="16">• r é a distância Terra-Lua</text>
              <text x="20" y="245" fill="white" font-size="16">• a é o semi-eixo maior da órbita (384.400 km)</text>
              <text x="20" y="275" fill="white" font-size="16">• e é a excentricidade da órbita (0,0549)</text>
              <text x="20" y="305" fill="white" font-size="16">• θ é o ângulo no plano orbital</text>
              
              <text x="0" y="345" fill="white" font-size="16">
                A variação da distância entre o perigeu e o apogeu é de aproximadamente 42.207 km,
              </text>
              <text x="0" y="370" fill="white" font-size="16">
                o que representa cerca de 11% da distância média Terra-Lua.
              </text>
              
              <text x="0" y="420" fill="white" font-size="16" font-weight="bold">Períodos orbitais:</text>
              <text x="20" y="450" fill="white" font-size="16">• Período sideral: 27,32 dias - tempo para a Lua completar uma órbita em</text>
              <text x="35" y="475" fill="white" font-size="16">relação às estrelas fixas.</text>
              <text x="20" y="505" fill="white" font-size="16">• Período sinódico: 29,53 dias - tempo entre fases lunares idênticas (ciclo</text>
              <text x="35" y="530" fill="white" font-size="16">completo de Lua Nova a Lua Nova).</text>
              
              <text x="0" y="580" fill="white" font-size="16" font-weight="bold">Fases da Lua:</text>
              <text x="20" y="610" fill="white" font-size="16">• Lua Nova: A face iluminada da Lua está voltada para o Sol e não é visível</text>
              <text x="35" y="635" fill="white" font-size="16">da Terra.</text>
              <text x="20" y="665" fill="white" font-size="16">• Quarto Crescente: Metade da face visível da Lua está iluminada, formando</text>
              <text x="35" y="690" fill="white" font-size="16">um "D" (hemisfério norte) ou um "C" invertido (hemisfério sul).</text>
              <text x="20" y="720" fill="white" font-size="16">• Lua Cheia: A face visível da Lua está completamente iluminada.</text>
              <text x="20" y="750" fill="white" font-size="16">• Quarto Minguante: Metade da face visível está iluminada, formando um "C"</text>
              <text x="35" y="775" fill="white" font-size="16">(hemisfério norte) ou um "D" invertido (hemisfério sul).</text>
              
              <text x="0" y="825" fill="white" font-size="16" font-weight="bold">Características adicionais:</text>
              <text x="20" y="855" fill="white" font-size="16">• Rotação síncrona: A Lua sempre mostra a mesma face para a Terra, pois seu</text>
              <text x="35" y="880" fill="white" font-size="16">período de rotação é igual ao seu período orbital.</text>
              <text x="20" y="910" fill="white" font-size="16">• Inclinação orbital: A órbita da Lua tem uma inclinação de aproximadamente</text>
              <text x="35" y="935" fill="white" font-size="16">5,14° em relação ao plano da eclíptica (órbita da Terra ao redor do Sol).</text>
              <text x="20" y="965" fill="white" font-size="16">• Esta inclinação é responsável por eclipses não ocorrerem mensalmente.</text>
            </g>
          </svg>
    </div>
</body>
</html>
