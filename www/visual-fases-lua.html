<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Visualização interativa das fases da Lua - Astronomia: Terra e Lua">
    <title>Fases da Lua - Astronomia</title>
    <link rel="stylesheet" href="css/language-switcher.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="400" height="400" fill="%23121212"/><circle cx="50" cy="50" r="1" fill="%23ffffff"/><circle cx="100" cy="150" r="0.8" fill="%23ffffff"/><circle cx="200" cy="50" r="0.6" fill="%23ffffff"/><circle cx="300" cy="200" r="1" fill="%23ffffff"/><circle cx="150" cy="300" r="0.7" fill="%23ffffff"/><circle cx="250" cy="350" r="0.9" fill="%23ffffff"/><circle cx="350" cy="100" r="0.5" fill="%23ffffff"/><circle cx="75" cy="200" r="0.8" fill="%23ffffff"/><circle cx="280" cy="120" r="0.6" fill="%23ffffff"/><circle cx="120" cy="80" r="0.7" fill="%23ffffff"/><circle cx="220" cy="180" r="0.4" fill="%23ffffff"/><circle cx="320" cy="280" r="0.6" fill="%23ffffff"/><circle cx="180" cy="380" r="0.8" fill="%23ffffff"/><circle cx="380" cy="180" r="0.7" fill="%23ffffff"/><circle cx="30" cy="280" r="0.5" fill="%23ffffff"/><circle cx="130" cy="380" r="0.9" fill="%23ffffff"/><circle cx="330" cy="30" r="0.6" fill="%23ffffff"/><circle cx="230" cy="130" r="0.5" fill="%23ffffff"/></svg>');
            background-attachment: fixed;
            background-size: 400px 400px;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            margin: 20px auto;
            padding: 20px;
            background-color: rgba(25, 25, 35, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #8be9fd;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            text-shadow: 0 0 10px rgba(139, 233, 253, 0.5);
            margin-bottom: 10px;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(45deg, #303048, #1e1e2a);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            border-left: 5px solid #ff79c6;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            align-self: flex-start;
            touch-action: manipulation;
        }

        .back-button:hover, .back-button:active {
            background: linear-gradient(45deg, #3a3a5e, #282840);
            border-left-color: #8be9fd;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .moon-phases-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
        }

        .moon-phase {
            text-align: center;
            width: 120px;
        }

        .moon-img {
            margin-bottom: 10px;
        }

        .phase-name {
            color: #f8f8f2;
            font-size: 0.9rem;
        }

        .interactive-section {
            width: 100%;
            max-width: 600px;
            margin-top: 40px;
            text-align: center;
        }

        .interactive-section h2 {
            color: #8be9fd;
            margin-bottom: 20px;
            font-size: clamp(1.5rem, 4vw, 2rem);
        }

        .interactive-moon {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #f5f3ce;
            position: relative;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px rgba(245, 243, 206, 0.5);
            overflow: hidden;
        }

        .shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #121212;
            transform: translateX(100px);
            transition: transform 0.5s ease;
        }

        .slider-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .slider {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: lightcyan;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .moon-phases-container {
                gap: 10px;
            }
            
            .moon-phase {
                width: 100px;
            }
            
            .interactive-moon {
                width: 150px;
                height: 150px;
            }
            
            .shadow {
                width: 150px;
                height: 150px;
                transform: translateX(75px);
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
                margin: 10px auto;
            }
            
            .moon-phase {
                width: 80px;
            }
            
            .moon-img svg {
                width: 80px;
                height: 80px;
            }
            
            .interactive-moon {
                width: 120px;
                height: 120px;
            }
            
            .shadow {
                width: 120px;
                height: 120px;
                transform: translateX(60px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Voltar</a>
        
        <header>
            <h1>Fases da Lua</h1>
        </header>
        
        <div class="content">
            <div class="moon-phases-container">
                <div class="moon-phase" data-phase="0">
                    <div class="moon-img">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="58" fill="#121212" stroke="#444" stroke-width="1"/>
                        </svg>
                    </div>
                    <div class="phase-name">Lua Nova</div>
                </div>
                
                <div class="moon-phase" data-phase="1">
                    <div class="moon-img">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="58" fill="#121212" stroke="#444" stroke-width="1"/>
                            <path d="M60,2 A58,58 0 0,1 60,118 A29,58 0 0,0 60,2" fill="#f5f3ce"/>
                        </svg>
                    </div>
                    <div class="phase-name">Lua Crescente</div>
                </div>
                
                <div class="moon-phase" data-phase="2">
                    <div class="moon-img">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="58" fill="#121212" stroke="#444" stroke-width="1"/>
                            <path d="M60,2 A58,58 0 0,1 60,118 A58,58 0 0,0 60,2" fill="#f5f3ce"/>
                        </svg>
                    </div>
                    <div class="phase-name">Quarto Crescente</div>
                </div>
                
                <div class="moon-phase" data-phase="3">
                    <div class="moon-img">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="58" fill="#121212" stroke="#444" stroke-width="1"/>
                            <path d="M60,2 A58,58 0 0,1 60,118 A87,58 0 0,0 60,2" fill="#f5f3ce"/>
                        </svg>
                    </div>
                    <div class="phase-name">Lua Gibosa Crescente</div>
                </div>
                
                <div class="moon-phase" data-phase="4">
                    <div class="moon-img">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="58" fill="#f5f3ce" stroke="#444" stroke-width="1"/>
                        </svg>
                    </div>
                    <div class="phase-name">Lua Cheia</div>
                </div>
                
                <div class="moon-phase" data-phase="5">
                    <div class="moon-img">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="58" fill="#f5f3ce" stroke="#444" stroke-width="1"/>
                            <path d="M60,2 A58,58 0 0,0 60,118 A87,58 0 0,1 60,2" fill="#121212"/>
                        </svg>
                    </div>
                    <div class="phase-name">Lua Gibosa Minguante</div>
                </div>
                
                <div class="moon-phase" data-phase="6">
                    <div class="moon-img">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="58" fill="#f5f3ce" stroke="#444" stroke-width="1"/>
                            <path d="M60,2 A58,58 0 0,0 60,118 A58,58 0 0,1 60,2" fill="#121212"/>
                        </svg>
                    </div>
                    <div class="phase-name">Quarto Minguante</div>
                </div>
                
                <div class="moon-phase" data-phase="7">
                    <div class="moon-img">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                            <circle cx="60" cy="60" r="58" fill="#f5f3ce" stroke="#444" stroke-width="1"/>
                            <path d="M60,2 A58,58 0 0,0 60,118 A29,58 0 0,1 60,2" fill="#121212"/>
                        </svg>
                    </div>
                    <div class="phase-name">Lua Minguante</div>
                </div>
            </div>
            
            <div class="interactive-section">
                <h2>Visualização Interativa</h2>
                <div class="interactive-moon">
                    <div class="shadow" id="moonShadow"></div>
                </div>
                
                <div class="slider-container">
                    <label for="moonPosition">Posição da Lua:</label>
                    <input type="range" id="moonPosition" class="slider" min="0" max="360" value="0">
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Astronomia: Terra e Lua - Versão 3.0</p>
            <p>&copy 2025. Desenvolvido por Caio Lima Firme e Claude 3.7</p>
        </div>
    </div>

    <script src="js/fasesLua.js"></script>
    <script src="js/dynamic-language-switcher.js"></script>
</body>
</html>
