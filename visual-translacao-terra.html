<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Visualização da Translação da Terra - Astronomia: Terra e Lua">
    <title>Visualização da Translação da Terra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .back-button {
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: rgba(25, 25, 35, 0.9);
            color: #8be9fd;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .back-button:hover, .back-button:active {
            background-color: rgba(35, 35, 45, 0.9);
            transform: scale(1.05);
        }
        
        svg {
            width: 100%;
            height: auto;
            max-width: 800px;
            margin: 0 auto;
            display: block;
        }
        
        text {
            font-family: Arial, sans-serif;
        }
        
        .info-section {
            max-width: 800px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: clamp(0.9rem, 2vw, 1rem);
            margin: 20px;
            box-sizing: border-box;
        }
        
        @media (max-width: 600px) {
            .back-button {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            text {
                font-size: 80% !important;
            }
            
            .info-section {
                padding: 15px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="window.location.href='index.html'">←</button>
    
    <div class="info-section">
        <svg viewBox="0 0 800 2000" xmlns="http://www.w3.org/2000/svg">
            <!-- Fundo -->
            <rect width="800" height="2000" fill="#111" />
            
            <!-- Área da visualização -->
            <g transform="translate(0, 100)">
              <!-- Linhas de referência -->
              <line x1="405" y1="50" x2="405" y2="450" stroke="#333" stroke-width="1" />
              <line x1="205" y1="250" x2="605" y2="250" stroke="#333" stroke-width="1" />
              
              <!-- Órbita da Terra (elipse) -->
              <ellipse cx="405" cy="250" rx="299.2" ry="299.16" 
                       fill="none" stroke="#555" stroke-width="1" />
              
              <!-- Eixo maior -->
              <line x1="105.8" y1="250" x2="704.2" y2="250" 
                    stroke="#444" stroke-width="1" stroke-dasharray="5,5" />
              
              <!-- Eixo menor -->
              <line x1="405" y1="-49.16" x2="405" y2="549.16" 
                    stroke="#444" stroke-width="1" stroke-dasharray="5,5" />
              
              <!-- Sol -->
              <circle cx="400" cy="250" r="20" fill="#FF9900">
                <animate attributeName="r" values="20;22;20" dur="2s" repeatCount="indefinite" />
              </circle>
              <circle cx="400" cy="250" r="25" fill="rgba(255,153,0,0.3)" />
              <circle cx="400" cy="250" r="30" fill="rgba(255,153,0,0.1)" />
              
              <!-- Terra nos pontos principais -->
              <!-- Periélio (Verão no Brasil) - Solstício de Verão -->
              <g transform="translate(105.8, 250)">
                <circle r="8" fill="#1E90FF" />
                <circle r="10" fill="rgba(30,144,255,0.3)" />
                <!-- Inclinação do eixo da Terra ~23.5° -->
                <line x1="0" y1="-12" x2="0" y2="12" stroke="#FFF" stroke-width="1" transform="rotate(-23.5)" />
                <text x="15" y="5" fill="white" font-size="14">Terra (Verão)</text>
                <text x="15" y="25" fill="orange" font-size="12">21 Dez</text>
                <text x="15" y="45" fill="#AAA" font-size="12">147.1 milhões km</text>
                <text x="15" y="65" fill="#FF5" font-size="12">Solstício de Verão</text>
              </g>
              
              <!-- Eixo menor 1 (Outono no Brasil) - Equinócio de Outono -->
              <g transform="translate(405, -49.16)">
                <circle r="8" fill="#1E90FF" />
                <circle r="10" fill="rgba(30,144,255,0.3)" />
                <line x1="0" y1="-12" x2="0" y2="12" stroke="#FFF" stroke-width="1" transform="rotate(-23.5)" />
                <text x="-80" y="-15" fill="white" font-size="14">Terra (Outono)</text>
                <text x="-80" y="-35" fill="orange" font-size="12">20 Mar</text>
                <text x="-80" y="-55" fill="#AAA" font-size="12">149.58 milhões km</text>
                <text x="-80" y="-75" fill="#FF5" font-size="12">Equinócio de Outono</text>
              </g>
              
              <!-- Afélio (Inverno no Brasil) - Solstício de Inverno -->
              <g transform="translate(704.2, 250)">
                <circle r="8" fill="#1E90FF" />
                <circle r="10" fill="rgba(30,144,255,0.3)" />
                <line x1="0" y1="-12" x2="0" y2="12" stroke="#FFF" stroke-width="1" transform="rotate(-23.5)" />
                <text x="-110" y="5" fill="white" font-size="14">Terra (Inverno)</text>
                <text x="-110" y="25" fill="orange" font-size="12">21 Jun</text>
                <text x="-110" y="45" fill="#AAA" font-size="12">152.1 milhões km</text>
                <text x="-110" y="65" fill="#FF5" font-size="12">Solstício de Inverno</text>
              </g>
              
              <!-- Eixo menor 2 (Primavera no Brasil) - Equinócio de Primavera -->
              <g transform="translate(405, 549.16)">
                <circle r="8" fill="#1E90FF" />
                <circle r="10" fill="rgba(30,144,255,0.3)" />
                <line x1="0" y1="-12" x2="0" y2="12" stroke="#FFF" stroke-width="1" transform="rotate(-23.5)" />
                <text x="15" y="5" fill="white" font-size="14">Terra (Primavera)</text>
                <text x="15" y="25" fill="orange" font-size="12">22 Set</text>
                <text x="15" y="45" fill="#AAA" font-size="12">149.58 milhões km</text>
                <text x="15" y="65" fill="#FF5" font-size="12">Equinócio de Primavera</text>
              </g>
              
              <!-- Setores das estações -->
              <path d="M 400 250 L 105.8 250 A 299.2 299.16 0 0 1 405 -49.16 Z" 
                    fill="rgba(255,100,100,0.15)" stroke="none" />
              <path d="M 400 250 L 405 -49.16 A 299.2 299.16 0 0 1 704.2 250 Z" 
                    fill="rgba(255,200,100,0.15)" stroke="none" />
              <path d="M 400 250 L 704.2 250 A 299.2 299.16 0 0 1 405 549.16 Z" 
                    fill="rgba(100,100,255,0.15)" stroke="none" />
              <path d="M 400 250 L 405 549.16 A 299.2 299.16 0 0 1 105.8 250 Z" 
                    fill="rgba(100,200,100,0.15)" stroke="none" />
              
              <!-- Linhas de solstícios e equinócios -->
              <line x1="400" y1="250" x2="105.8" y2="250" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="10,5" />
              <line x1="400" y1="250" x2="704.2" y2="250" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="10,5" />
              <line x1="400" y1="250" x2="405" y2="-49.16" stroke="#87CEEB" stroke-width="1.5" stroke-dasharray="10,5" />
              <line x1="400" y1="250" x2="405" y2="549.16" stroke="#87CEEB" stroke-width="1.5" stroke-dasharray="10,5" />
              
              <!-- Legenda -->
              <text x="50" y="30" fill="white" font-size="18" font-weight="bold">Translação da Terra</text>
              <text x="50" y="60" fill="rgb(255,100,100)" font-size="16">■ Verão</text>
              <text x="50" y="85" fill="rgb(255,200,100)" font-size="16">■ Outono</text>
              <text x="50" y="110" fill="rgb(100,100,255)" font-size="16">■ Inverno</text>
              <text x="50" y="135" fill="rgb(100,200,100)" font-size="16">■ Primavera</text>
              <text x="50" y="170" fill="#AAA" font-size="14">* Estações no Hemisfério Sul (Brasil)</text>
              <text x="50" y="195" fill="#AAA" font-size="14">* Inclinação do eixo da Terra: ~23.5°</text>
              <text x="50" y="220" fill="#FFD700" font-size="14">--- Solstícios (21 Dez e 21 Jun)</text>
              <text x="50" y="245" fill="#87CEEB" font-size="14">--- Equinócios (20 Mar e 22 Set)</text>
            </g>
            
            <!-- Informações adicionais -->
            <g transform="translate(50, 700)">
              <text x="0" y="0" fill="white" font-size="18" font-weight="bold">Informações sobre a Órbita Terrestre</text>
              
              <text x="0" y="40" fill="white" font-size="16">
                A Terra realiza um movimento elíptico ao redor do Sol, embora seja uma elipse com baixa 
              </text>
              <text x="0" y="65" fill="white" font-size="16">
                excentricidade (aproximadamente 0,0167), o que a torna quase circular.
              </text>
              
              <text x="20" y="100" fill="white" font-size="16">• Quando a Terra está no periélio, ela está mais próxima do Sol</text>
              <text x="20" y="130" fill="white" font-size="16">• Quando está no afélio, está mais distante do Sol</text>
              
              <text x="0" y="170" fill="white" font-size="16">
                A equação que descreve a distância (raio) entre a Terra e o Sol em qualquer ponto da 
              </text>
              <text x="0" y="195" fill="white" font-size="16">
                órbita elíptica é:
              </text>
              
              <text x="0" y="235" fill="#8CF" font-size="20" font-weight="bold">r = a(1-e²)/(1+e·cos(θ))</text>
              
              <text x="0" y="275" fill="white" font-size="16">Onde:</text>
              <text x="20" y="305" fill="white" font-size="16">• r é a distância Terra-Sol</text>
              <text x="20" y="335" fill="white" font-size="16">• a é o semi-eixo maior da órbita (aproximadamente 149,6 milhões de km)</text>
              <text x="20" y="365" fill="white" font-size="16">• e é a excentricidade da órbita terrestre (aproximadamente 0,0167)</text>
              <text x="20" y="395" fill="white" font-size="16">• θ é o ângulo no plano orbital</text>
              
              <text x="0" y="435" fill="white" font-size="16">
                A variação total do raio entre esses pontos extremos é: Δr = r_afélio - r_periélio ≈ 5 milhões de km
              </text>
              
              <text x="0" y="475" fill="white" font-size="16">
                Esta variação de aproximadamente 3,3% na distância Terra-Sol ao longo do ano é relativamente 
              </text>
              <text x="0" y="500" fill="white" font-size="16">
                pequena, mas suficiente para causar uma mudança perceptível na intensidade da radiação solar 
              </text>
              <text x="0" y="525" fill="white" font-size="16">
                recebida pela Terra, sendo aproximadamente 6,9% maior no periélio que no afélio.
              </text>
              
              <text x="0" y="575" fill="white" font-size="16" font-weight="bold">Pontos principais da órbita:</text>
              <text x="20" y="605" fill="white" font-size="16">• Periélio: 147,1 milhões de km (coincide com o Solstício de Verão no</text>
              <text x="35" y="630" fill="white" font-size="16">Hemisfério Sul - 21 de dezembro)</text>
              <text x="20" y="660" fill="white" font-size="16">• Afélio: 152,1 milhões de km (coincide com o Solstício de Inverno no</text>
              <text x="35" y="685" fill="white" font-size="16">Hemisfério Sul - 21 de junho)</text>
              <text x="20" y="715" fill="white" font-size="16">• Pontos do eixo menor: 149,58 milhões de km (coincidem com os Equinócios -</text>
              <text x="35" y="740" fill="white" font-size="16">20 de março e 22 de setembro)</text>
              
              <text x="0" y="790" fill="white" font-size="16" font-weight="bold">Características astronômicas representadas:</text>
              <text x="20" y="820" fill="white" font-size="16">• Solstícios: pontos em que o Sol atinge a posição mais extrema em relação</text>
              <text x="35" y="845" fill="white" font-size="16">ao equador celeste</text>
              <text x="20" y="875" fill="white" font-size="16">• Equinócios: momentos em que o Sol cruza o plano do equador da Terra</text>
              <text x="20" y="905" fill="white" font-size="16">• A inclinação do eixo da Terra de aproximadamente 23,5°</text>
              <text x="20" y="935" fill="white" font-size="16">• A excentricidade da órbita de 0,0167</text>
              
              <text x="0" y="985" fill="white" font-size="16" font-weight="bold">Relação com as estações:</text>
              <text x="20" y="1015" fill="white" font-size="16">• Verão no Brasil: entre o Solstício de Verão (21 Dez) e o Equinócio de</text>
              <text x="35" y="1040" fill="white" font-size="16">Outono (20 Mar)</text>
              <text x="20" y="1070" fill="white" font-size="16">• Outono no Brasil: entre o Equinócio de Outono (20 Mar) e o Solstício de</text>
              <text x="35" y="1095" fill="white" font-size="16">Inverno (21 Jun)</text>
              <text x="20" y="1125" fill="white" font-size="16">• Inverno no Brasil: entre o Solstício de Inverno (21 Jun) e o Equinócio de</text>
              <text x="35" y="1150" fill="white" font-size="16">Primavera (22 Set)</text>
              <text x="20" y="1180" fill="white" font-size="16">• Primavera no Brasil: entre o Equinócio de Primavera (22 Set) e o Solstício de</text>
              <text x="35" y="1205" fill="white" font-size="16">Verão (21 Dez)</text>
            </g>
          </svg>
    </div>
</body>
</html>
